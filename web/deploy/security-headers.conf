# Security headers for rafalgryncewicz.com – copy to /etc/nginx/snippets/rafalgryncewicz-security-headers.conf.
# Included in EVERY location of nginx.conf: Nginx drops all server-level add_header directives in a
# location that defines its own add_header (e.g. Cache-Control), so they cannot live at server level.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
