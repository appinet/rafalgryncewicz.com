# Example Nginx vhost for the static build (.output/public) – adjust paths and certificates.
server {
    listen 443 ssl;
    http2 on;
    server_name rafalgryncewicz.com;

    root /var/www/rafalgryncewicz.com/public;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/rafalgryncewicz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rafalgryncewicz.com/privkey.pem;

    # Compression (add brotli if the module is installed)
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Security headers are included in each location below, not here: a location with its own
    # add_header (Cache-Control) would silently drop server-level ones. See security-headers.conf.

    # Hashed assets: cache forever
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/rafalgryncewicz-security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(png|svg|ico|webp|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        include snippets/rafalgryncewicz-security-headers.conf;
        try_files $uri =404;
    }

    # HTML: always revalidate
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        include snippets/rafalgryncewicz-security-headers.conf;
        # CSP (Report-Only for now), generated with every build: web/.output/nginx/csp.conf
        include snippets/rafalgryncewicz-csp.conf;
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # Dotfiles (e.g. the generated .htaccess used on Apache hosting) are never served
    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;
}

server {
    listen 80;
    listen 443 ssl;
    server_name www.rafalgryncewicz.com;
    ssl_certificate     /etc/letsencrypt/live/rafalgryncewicz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rafalgryncewicz.com/privkey.pem;
    return 301 https://rafalgryncewicz.com$request_uri;
}

server {
    listen 80;
    server_name rafalgryncewicz.com;
    return 301 https://rafalgryncewicz.com$request_uri;
}
