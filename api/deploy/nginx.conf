# Example Nginx vhost for the Laravel API (api.rafalgryncewicz.com)
server {
    listen 443 ssl;
    http2 on;
    server_name api.rafalgryncewicz.com;
    root /var/www/rafalgryncewicz.com/api/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/api.rafalgryncewicz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rafalgryncewicz.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 64k;

    # Behind Cloudflare (orange cloud): restore the visitor's IP so Laravel's rate limiting and the
    # stored lead IP are not the Cloudflare edge address. Keep the list current from
    # https://www.cloudflare.com/ips/ (or set TRUSTED_PROXIES in .env instead – use one approach).
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # ... remaining Cloudflare IPv4 / IPv6 ranges ...
    # real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
